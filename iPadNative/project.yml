name: TouchBridgeNative
options:
  deploymentTarget:
    iOS: '17.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
targets:
  TouchBridgeNative:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ThirdPartyNotices.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.touchbridge.ipad.native
        PRODUCT_NAME: TouchBridgeNative
        TARGETED_DEVICE_FAMILY: '2'
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge.h
        LIBRARY_SEARCH_PATHS: '$(inherited) $(SRCROOT)/Rust/target/aarch64-apple-ios/release'
        OTHER_LDFLAGS: '$(inherited) -ltouchbridge_ipad -lresolv -lc++ -framework Security -framework CoreFoundation'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TouchBridge iPad
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 允许自己的主控设备通过同一无线局域网连接 iPad。
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: false
schemes:
  TouchBridgeNative:
    build:
      targets:
        TouchBridgeNative: all
    archive:
      config: Release
